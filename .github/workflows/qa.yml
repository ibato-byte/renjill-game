# 自動チェック（AI なし・無料）。GitHub の無料時間（月2000分）に収まるよう：main への変更ごとは短いチェック（smoke・約1分）だけで公開、
# くわしいチェック（quick）は週3回、全部（full）は週1回。変更する前に手元で quick を全部通すのが約束（CLAUDE.md）。
name: qa
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 20 * * 0,2,4' # 月・水・金の朝 5:17（日本時間）quick
    - cron: '27 18 * * 0' # 毎週月曜 3:27（日本時間）full
  workflow_dispatch:
    inputs:
      mode: { description: 'quick か full', default: 'quick' }
permissions:
  contents: write
# a newer push to the same branch replaces a run still in progress (so an older upload never publishes over a newer one)
concurrency:
  group: qa-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Automation Hub：一時停止の確認
        id: hub
        if: github.event_name != 'pull_request'
        env:
          HUB_TOKEN: ${{ secrets.HUB_TOKEN }}
        run: |
          if [ -z "$HUB_TOKEN" ] || ! git clone -q --depth 1 "https://x-access-token:${HUB_TOKEN}@github.com/ibato-byte/automation-hub.git" "$RUNNER_TEMP/hub"; then
            echo "paused=false" >> "$GITHUB_OUTPUT"; echo "Automation Hub を使わずに続ける"; exit 0
          fi
          bash "$RUNNER_TEMP/hub/scripts/gha.sh" check renjill-game
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm i --no-save playwright@1 && npx playwright install --with-deps chromium
      - run: sudo apt-get install -y fonts-noto-cjk ffmpeg >/dev/null
      - run: python3 build.py && cp app/feed.json dist/feed.json
      - name: QA
        run: node qa/run-all.mjs ${{ github.event.schedule == '27 18 * * 0' && 'full' || (github.event_name == 'push' && 'smoke') || (github.event.inputs.mode || 'quick') }}
      - name: 遊んだ人の数（KPI）と毎日の記録（data/kpi.csv）
        if: always()
        run: |
          node qa/kpi.mjs || true
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f data/kpi.csv ]; then
            git config user.name "renjill-bot"; git config user.email "renjill-bot@users.noreply.github.com"
            git add data/kpi.csv && git commit -m "KPI: $(date +%F)" && git push || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: qa-report, path: "qa-report.*\nkpi.json\n/tmp/rj-shots/**" }
      - name: 結果をまとめに出す
        if: always()
        # ログにも出す：不合格の詳しい理由を、成果物をダウンロードせずに読めるように（Hub 依頼 #230）
        run: cat qa-report.md | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Automation Hub に記録（失敗したら「修正」の依頼・遊んだ人の数を表示）
        if: always() && github.event_name != 'pull_request'
        env:
          HUB_TOKEN: ${{ secrets.HUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          PAUSED: ${{ steps.hub.outputs.paused }}
        run: |
          [ -d "$RUNNER_TEMP/hub" ] || exit 0
          extra=()
          if [ -f kpi.json ]; then
            extra+=(--kpi "遊んだ人=$(node -p "require('./kpi.json').players_total")" --kpi "今月遊んだ人=$(node -p "require('./kpi.json').players_this_month")" --kpi "直近7日に遊んだ人=$(node -p "require('./kpi.json').active_7d")")
          fi
          # 結果の文は合否で変える（失敗でも「全部合格」と書いていた）。次の予定は台帳の schedule.cron（月・水・金 5:17）から出す（毎日として出していたため Hub が「遅れ」と誤判定していた。Hub 依頼 #230）
          if [ "$JOB_STATUS" = "success" ]; then msg="ゲームの自動チェックが全部合格しました。"; else msg="ゲームの自動チェックで不合格がありました：$(node -p "(require('./qa-report.json').failed||[]).join('、')" 2>/dev/null || echo 不明)"; fi
          bash "$RUNNER_TEMP/hub/scripts/gha.sh" report renjill-game "$JOB_STATUS" "$PAUSED" "$msg" \
            --outcome done --does "ゲームの自動チェックを動かし、遊んだ人の数を数えた" \
            --next-run-at cron "${extra[@]}"
  deploy:
    needs: qa
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: トークンがあるときだけ公開
        id: chk
        run: echo "ok=${{ secrets.CLOUDFLARE_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - name: 公開（Cloudflare Pages）
        if: steps.chk.outputs.ok == 'true'
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b3563f7747cafbc81a977a3b4edbfca3
        run: |
          # 貼り付けたときに入りやすい改行・空白・「Bearer 」を取り除く
          T="$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')"; T="${T#Bearer}"
          if ! printf '%s' "$T" | LC_ALL=C grep -qE '^[A-Za-z0-9_-]{20,}$'; then
            echo "::error::CLOUDFLARE_API_TOKEN の形がちがいます（英数字だけの長い文字列のはず）。Cloudflare で作ったトークンの値を、そのまま貼り直してください。"
            exit 1
          fi
          export CLOUDFLARE_API_TOKEN="$T"
          python3 build.py && npx --yes wrangler@3 pages deploy app --project-name renjill-hay-dash --branch main --commit-dirty=true
      - name: 検索エンジンに更新を知らせる（IndexNow・アカウント不要）
        if: steps.chk.outputs.ok == 'true'
        run: |
          KEY=$(python3 -c "import seo; print(seo.INDEXNOW_KEY)"); S=https://hay-dash.coana.co.jp
          curl -s -X POST https://api.indexnow.org/indexnow -H 'content-type: application/json; charset=utf-8' \
            -d "{\"host\":\"hay-dash.coana.co.jp\",\"key\":\"$KEY\",\"keyLocation\":\"$S/$KEY.txt\",\"urlList\":[\"$S/\",\"$S/guide\",\"$S/guide-en\",\"$S/ranking\"]}" \
            -o /dev/null -w "IndexNow %{http_code}\n" || true
