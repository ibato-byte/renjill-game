# 毎朝の自動チェック（AI なし・無料）と、main への変更ごとのチェック。合格したら公開（Cloudflare Pages）。
name: qa
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 20 * * *'   # 毎朝 5:17（日本時間）quick
    - cron: '27 18 * * 0'   # 毎週月曜 3:27（日本時間）full
  workflow_dispatch:
    inputs:
      mode: { description: 'quick か full', default: 'quick' }
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm i --no-save playwright@1 && npx playwright install --with-deps chromium
      - run: sudo apt-get install -y fonts-noto-cjk ffmpeg >/dev/null
      - run: python3 build.py && cp app/feed.json dist/feed.json
      - name: QA
        run: node qa/run-all.mjs ${{ github.event.schedule == '27 18 * * 0' && 'full' || (github.event.inputs.mode || 'quick') }}
      - name: 遊んだ人の数（KPI）と毎日の記録（data/kpi.csv）
        if: always()
        run: |
          node qa/kpi.mjs || true
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f data/kpi.csv ]; then
            git config user.name "renjill-bot"; git config user.email "renjill-bot@users.noreply.github.com"
            git add data/kpi.csv && git commit -m "KPI: $(date +%F)" && git push || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: qa-report, path: "qa-report.*\nkpi.json\n/tmp/rj-shots/**" }
      - name: 結果をまとめに出す
        if: always()
        run: cat qa-report.md >> "$GITHUB_STEP_SUMMARY"
  deploy:
    needs: qa
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: トークンがあるときだけ公開
        id: chk
        run: echo "ok=${{ secrets.CLOUDFLARE_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.chk.outputs.ok == 'true'
        run: python3 build.py && npx --yes wrangler@3 pages deploy app --project-name renjill-hay-dash --branch main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b3563f7747cafbc81a977a3b4edbfca3
