<title>レンとジルのチモシーダッシュ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout: one full-screen game stage; menus are paper cards laid over the 3D house. Single warm "office memo" look by choice. */
:root{
  --cream:#F6EBDC; --paper:#FBF6EE; --ink:#3B2A20; --ink-soft:#6E5848;
  --tie:#D6A23C; --tie-deep:#A97A1E; --badge:#4E77A0; --badge-deep:#355F86;
  --stamp:#C8463C; --leaf:#5F9E5A; --line:rgba(59,42,32,.16);
  --f-display:"Dela Gothic One","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--ink);color:var(--ink);overscroll-behavior:none}
body{font-family:var(--f-body);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
#app{position:fixed;inset:0;overflow:hidden;background:#5a4634}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
button{font-family:var(--f-body);cursor:pointer;color:var(--ink)}
button:focus-visible{outline:3px solid var(--badge);outline-offset:2px}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none;
  padding-top:env(safe-area-inset-top,0px);padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.hud-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:8px;padding-top:10px}
.chip{background:rgba(251,246,238,.92);border-radius:14px;padding:6px 10px;box-shadow:0 2px 0 rgba(59,42,32,.25)}
.score{justify-self:start;display:flex;flex-direction:column;line-height:1}
.score b{font-family:var(--f-display);font-size:clamp(20px,5.4vw,30px);letter-spacing:.02em;font-variant-numeric:tabular-nums;font-weight:400}
.score small{font-size:12px;font-weight:900;color:var(--tie-deep);margin-top:2px}
.clock{justify-self:center;text-align:center;line-height:1.05;min-width:96px}
.clock .day{font-size:10px;font-weight:900;letter-spacing:.14em;color:var(--ink-soft)}
.clock b{display:block;font-family:var(--f-display);font-weight:400;font-size:clamp(20px,5vw,26px);font-variant-numeric:tabular-nums}
.clock .room{font-size:11px;font-weight:700;color:var(--ink-soft);white-space:nowrap}
.hay{justify-self:end;display:flex;align-items:center;gap:6px}
.hay img{width:26px;height:26px}
.hay b{font-family:var(--f-display);font-weight:400;font-size:clamp(18px,4.6vw,24px);font-variant-numeric:tabular-nums}
#feverBar{margin:8px auto 0;width:min(320px,74%);height:18px;border-radius:8px;background:rgba(59,42,32,.35);overflow:hidden;position:relative;box-shadow:0 0 0 2px rgba(251,246,238,.85)}
#feverFill{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,var(--leaf),#9BC86A);border-radius:8px;transition:width .15s}
#feverBar.on #feverFill{background:linear-gradient(90deg,var(--tie),#F2D27A,var(--tie));}
#feverBar span{position:absolute;left:8px;top:0;bottom:0;font-size:11px;line-height:18px;font-weight:900;color:var(--paper);text-shadow:0 1px 0 rgba(0,0,0,.35);white-space:nowrap}
#feverBar b{position:absolute;right:8px;top:0;bottom:0;font-family:var(--f-display);font-weight:400;font-size:12px;line-height:18px;color:var(--paper);text-shadow:0 1px 0 rgba(0,0,0,.35);font-variant-numeric:tabular-nums}
#feverBar.soon{animation:soon .5s ease-in-out infinite alternate;box-shadow:0 0 0 2px var(--tie),0 0 14px rgba(242,194,48,.9)}
#feverBar.on{box-shadow:0 0 0 3px var(--tie),0 0 18px rgba(242,194,48,.95)}
#feverBar.gain{box-shadow:0 0 0 2px #FBF6EE,0 0 10px rgba(155,200,106,.9)}
@keyframes soon{from{transform:scale(1)}to{transform:scale(1.05)}}
#feverGlow{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;box-shadow:inset 0 0 70px 18px rgba(242,194,48,.55)}
#feverGlow.on{opacity:1}
#sTitle .row2{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}#sTitle .row2 .sub{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:10px 6px;font-size:13px}
#sTitle .row2 .sub::before{display:block;font-size:17px;line-height:1.1;margin-bottom:2px;color:var(--badge-deep)}#btnRank::before{content:'♛'}#btnName::before{content:'✎'}#btnChat::before{content:'❝'}

.namebox input{width:100%;font:inherit;font-size:18px;padding:10px 12px;border-radius:12px;border:2px solid var(--ink);background:#fff;color:var(--ink);box-sizing:border-box}
.namebox .btns{display:flex;gap:8px;margin-top:12px}.namebox .btns button{flex:1}
.rk-name{margin:6px 0}.rk-name label{font-size:12px;font-weight:900}.rk-name .btns{margin-top:6px}.rk-name input{flex:2;font-size:16px;padding:8px 10px}.rk-name .btns button{flex:1}
#sChat{z-index:8;background:rgba(59,42,32,.55)}.panel.chat{height:min(640px,100%);}
.chatlog{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:8px;touch-action:pan-y;-webkit-user-select:text;user-select:text}
.msg{max-width:84%;padding:8px 12px;border-radius:14px;font-size:14px;line-height:1.55;font-weight:700;white-space:pre-wrap;word-break:break-word}
.msg.bot{align-self:flex-start;background:var(--cream);color:var(--ink);border-bottom-left-radius:4px}.msg.me{align-self:flex-end;background:var(--ink);color:var(--paper);border-bottom-right-radius:4px}
.msg.wait{opacity:.6;animation:tpulse .6s ease-in-out infinite alternate}
.chatsug{display:flex;gap:6px;overflow-x:auto;padding:0 12px 6px;scrollbar-width:none}.chatsug button{flex:0 0 auto;white-space:nowrap}
.chatform{display:flex;gap:6px;padding:8px 12px}.chatform input{flex:1;min-width:0;font:inherit;font-size:16px;padding:10px 12px;border-radius:12px;border:2px solid var(--ink);background:#fff;color:var(--ink)}
.chatform .big{font-size:16px;padding:8px 14px}#sChat .note{padding:0 12px 10px;margin:0;font-size:11px}
#lives.hide{display:none}#lives{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:6px;font-size:11px;font-weight:800;color:var(--paper);text-shadow:0 1px 2px rgba(0,0,0,.55)}
#lives .hs{display:flex;gap:3px}#lives i{width:16px;height:14px;background:#E2434B;clip-path:path('M8 14 L1.2 6.8 A3.8 3.8 0 0 1 8 2.6 A3.8 3.8 0 0 1 14.8 6.8 Z');filter:drop-shadow(0 1px 0 rgba(0,0,0,.4))}
#lives.one i:last-child{background:rgba(251,246,238,.35)}#lives.warn i:not(.off){animation:tpulse .35s ease-in-out infinite alternate}#lives.warn em{color:#FFD45C}
#pows{display:flex;gap:6px;justify-content:center;margin-top:8px;flex-wrap:wrap}
.pow{display:flex;align-items:center;gap:6px;background:rgba(251,246,238,.92);border-radius:12px;padding:3px 8px 3px 4px;font-size:11px;font-weight:900}
.pow img{width:22px;height:22px}
.pow i{display:block;width:44px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.pow i u{display:block;height:100%;background:var(--tie)}
#pauseBtn{pointer-events:auto;position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));width:44px;height:44px;border-radius:50%;border:0;background:rgba(251,246,238,.9);font-family:var(--f-display);font-size:14px;box-shadow:0 2px 0 rgba(59,42,32,.3)}
#toasts{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 132px);display:flex;flex-direction:column;align-items:center;gap:8px}
.toast{background:var(--paper);border-radius:16px;padding:8px 16px;text-align:center;box-shadow:0 3px 0 rgba(59,42,32,.3);animation:pop .35s cubic-bezier(.2,1.6,.4,1) both, fade .4s ease-in 1.9s forwards;max-width:86vw}
.toast .en{font-family:var(--f-display);font-size:clamp(18px,5vw,26px);display:block;letter-spacing:.02em}
.toast .ja{font-size:13px;font-weight:700;color:var(--ink-soft)}
.toast.room{background:var(--ink);color:var(--paper)}
.toast.room .ja{color:var(--tie)}
.toast.good{background:var(--tie);}
.toast.bad{background:var(--stamp);color:var(--paper)}
.toast.bad .ja{color:var(--paper)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fade{to{opacity:0;transform:translateY(-14px)}}
#hint{position:absolute;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));text-align:center;font-weight:900;font-size:14px;color:var(--paper);text-shadow:0 2px 0 rgba(0,0,0,.35);transition:opacity .4s}
#turnCue{position:absolute;top:44%;font-family:var(--f-display);font-size:clamp(46px,14vw,80px);color:var(--tie);text-shadow:0 4px 0 var(--ink);opacity:0;transition:opacity .12s}
#turnCue.l{left:8%}#turnCue.r{right:8%}#turnCue.show{opacity:1}
#hChal{display:block;font-size:10px;font-weight:900;color:#C8463C;letter-spacing:.02em}#hChal:empty{display:none}
#combo{display:block;font-weight:900;font-size:11px;color:var(--tie);min-height:0}#combo:empty{display:none}

html[lang="ja"] .mini em{white-space:nowrap;font-size:10px;letter-spacing:-.02em}.shop-item p{font-size:13px;line-height:1.35}
/* short screens: tighten the title so START is on screen */
/* ---------- Screens ---------- */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box;overflow-y:auto}
.screen.center{justify-content:center;background:rgba(59,42,32,.55)}
.logo{text-align:center;margin-top:auto;margin-bottom:14px;padding-top:max(2vh,16px);flex-shrink:0}
.screen>.card,.screen>.panel{flex-shrink:0}
.screen.center>.card{margin:auto 0}
.logo .k{font-size:12px;font-weight:900;letter-spacing:.3em;color:var(--paper);opacity:.9}
.logo h1{margin:4px 0 0;font-family:var(--f-display);font-weight:400;font-size:clamp(34px,min(12vw,8.5vh),76px);line-height:.95;color:var(--paper);text-shadow:0 5px 0 var(--ink),0 0 0 var(--ink);letter-spacing:.01em;text-wrap:balance}
.logo h1 em{font-style:normal;color:var(--tie)}
.logo .ja{display:inline-block;margin-top:10px;background:var(--paper);border-radius:10px;padding:4px 12px;font-weight:900;font-size:15px}
.card{background:var(--paper);border-radius:22px;padding:16px;width:min(440px,100%);box-sizing:border-box;box-shadow:0 6px 0 rgba(59,42,32,.35);display:flex;flex-direction:column;gap:12px}
.story{margin:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.story .stp{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:var(--cream);border-radius:12px;padding:6px 4px;font-size:12px;font-weight:900;line-height:1.3;color:var(--ink);text-align:center;min-width:0;word-break:keep-all;overflow-wrap:anywhere}
.story .stp b{font-size:10.5px;color:var(--paper);background:var(--badge-deep);border-radius:999px;padding:1px 8px;margin-bottom:2px}
.story .stp:not(:last-child)::after{content:'';position:absolute;right:-6px;top:50%;width:6px;height:2px;background:var(--line)}
.chars{display:grid;grid-template-columns:1fr 1fr;gap:10px}.chars.three{grid-template-columns:1fr 1fr 1fr;gap:8px}.chars.three .role,.chars.three .perk{font-size:10px;letter-spacing:-.02em}.char[hidden]{display:none}
.char{border:2px solid var(--line);background:var(--cream);border-radius:16px;padding:8px 8px 10px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.char[aria-pressed="true"]{border-color:var(--ink);background:#fff;box-shadow:inset 0 0 0 2px var(--tie)}
.char canvas{width:100%;height:auto;aspect-ratio:1/1;max-width:min(100%,150px,19vh);margin:0 auto;display:block}
.char .nm{font-family:var(--f-display);font-size:16px}
.char .role{font-size:11px;font-weight:700;color:var(--ink-soft);word-break:keep-all;overflow-wrap:anywhere;line-height:1.3}
.char .perk{font-size:11px;font-weight:900;color:var(--badge-deep);word-break:keep-all;overflow-wrap:anywhere;line-height:1.3}
.big{border:0;border-radius:18px;background:var(--ink);color:var(--paper);font-family:var(--f-display);font-size:24px;padding:14px;letter-spacing:.04em;box-shadow:0 5px 0 #1d140f}
.big#btnStart{background:linear-gradient(#4a3528,var(--ink));animation:startBob 2.4s ease-in-out infinite}
@keyframes startBob{0%,100%{box-shadow:0 5px 0 #1d140f,0 0 0 0 rgba(242,184,75,.0)}50%{box-shadow:0 5px 0 #1d140f,0 0 0 6px rgba(242,184,75,.45)}}
@media (prefers-reduced-motion:reduce){.big#btnStart{animation:none}}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #1d140f}
.row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.mini{border:0;border-radius:14px;background:var(--cream);padding:8px 4px;font-weight:900;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
html[lang="ja"] .mini span{display:none}html[lang="ja"] .ph small{display:none}
.mini span{font-family:var(--f-display);font-size:10px;font-weight:400;letter-spacing:.06em;color:var(--ink-soft)}
.mini em{font-style:normal;font-size:11px;line-height:1.2;text-align:center}
.mini .dot{position:absolute;top:4px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--stamp)}
.bank{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:900;color:var(--ink-soft)}
.bank b{font-family:var(--f-display);font-weight:400;font-size:16px;color:var(--ink)}
.bank img{width:20px;height:20px;vertical-align:-4px}
.panel{background:var(--paper);border-radius:22px;width:min(460px,100%);max-height:100%;box-sizing:border-box;box-shadow:0 6px 0 rgba(59,42,32,.35);display:flex;flex-direction:column;overflow:hidden}
.panel header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;border-bottom:2px dashed var(--line)}
.panel h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:20px;line-height:1.1}
.panel h2 small{display:block;font-family:var(--f-body);font-size:11px;font-weight:900;color:var(--ink-soft);letter-spacing:.08em}
.x{border:0;background:var(--cream);width:38px;height:38px;border-radius:50%;font-weight:900;font-size:16px}
.panel .body{padding:12px 16px 16px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;-webkit-user-select:text;user-select:text;touch-action:pan-y}
.m{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--cream)}
.m p{margin:0;font-weight:700;font-size:13px;min-width:0}
.m .prog{grid-column:1/-1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.m .prog i{display:block;height:100%;background:var(--leaf)}
.m .n{font-size:12px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--ink-soft)}
.m.done{background:#E7F0DC}
.m.done .n{color:var(--leaf)}
.lvl{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:700;color:var(--ink-soft)}
.lvl b{font-family:var(--f-display);font-weight:400;font-size:28px;color:var(--stamp)}
.shop-item{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:10px;border-radius:14px;background:var(--cream)}
.shop-item img{width:44px;height:44px}
.shop-item p{margin:0;font-size:13px;font-weight:900;min-width:0}
.shop-item p small{display:block;font-size:11px;font-weight:700;color:var(--ink-soft)}
.pips{display:flex;gap:3px;margin-top:4px}
.pips i{width:12px;height:6px;border-radius:2px;background:var(--line)}
.pips i.on{background:var(--tie)}
.buy{border:0;border-radius:12px;background:var(--ink);color:var(--paper);font-weight:900;font-size:12px;padding:8px 10px;display:flex;align-items:center;gap:4px;white-space:nowrap}
.buy img{width:16px;height:16px}
.buy:disabled{background:var(--line);color:var(--ink-soft);cursor:default}
.zk{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.zi{border:0;border-radius:14px;background:var(--cream);padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:900;min-width:0}
.zi img{width:48px;height:48px}
.zi.locked img{filter:brightness(0) opacity(.25)}
.zi.locked{color:var(--ink-soft)}
.zi.ng{background:#F6DEDA}
.zdetail{border-radius:14px;padding:12px;background:var(--ink);color:var(--paper);font-size:13px;line-height:1.7;font-weight:700}
.zdetail b{font-family:var(--f-display);font-weight:400;font-size:16px;color:var(--tie);display:block}
.note{font-size:11px;line-height:1.6;color:var(--ink-soft);margin:0}
#igNote{font-size:12px;margin-top:6px}.feedcard{display:flex;align-items:center;gap:8px;margin:6px 0 0;padding:7px 12px;border-radius:12px;background:rgba(255,255,255,.75);border:2px solid var(--line);color:var(--ink);text-decoration:none;font-size:12px}.feedcard small{color:#C8463C;font-weight:900;white-space:nowrap}.feedcard b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.feedcard i{font-style:normal;color:var(--ink-soft)}.chalcard{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:14px;background:linear-gradient(180deg,#FFF6DF,#FCE9C4);border:2px solid #E3B35A;box-shadow:0 2px 0 #E3B35A55}.chalcard img{width:40px;height:40px;border-radius:50%;background:#fff;flex:none}.chalcard span{display:flex;flex-direction:column;min-width:0}.chalcard small{font-size:11px;font-weight:900;color:#C8463C;letter-spacing:.04em}.chalcard b{font-family:var(--f-display);font-size:20px;line-height:1.15}
.small-print a{color:inherit;text-decoration:underline;text-underline-offset:2px}
.sub.danger{color:#B3352A;box-shadow:inset 0 0 0 2px #E7B3AC}.m.reset{border-top:1px dashed var(--line);margin-top:10px;padding-top:10px}
.notelink{display:inline-block;margin-top:4px;padding:6px 12px;border-radius:999px;background:var(--ink);color:#fff;font-weight:800;text-decoration:none}
.how{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center;font-size:13px;font-weight:700}
.how kbd{font-family:var(--f-display);font-size:13px;background:var(--cream);border-radius:8px;padding:6px 8px;text-align:center;min-width:64px}
.res-cap{text-align:center}
.res-cap .en{font-family:var(--f-display);font-size:clamp(26px,8vw,40px);display:block;line-height:1.05;text-wrap:balance}
.res-cap .ja{font-weight:900;font-size:14px;color:var(--ink-soft)}
.hi{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}.hi:empty{display:none}.hi span{background:var(--cream);border-radius:999px;padding:4px 10px;font-size:11px;font-weight:900;color:var(--ink)}.hi span.new{background:var(--tie)}
.last{margin:0;font-size:12px;font-weight:800;color:var(--ink-soft);text-align:center;line-height:1.5}
.res-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.res-grid div{background:var(--cream);border-radius:14px;padding:8px;text-align:center;min-width:0}
.res-grid small{display:block;font-size:10px;font-weight:900;color:var(--ink-soft);letter-spacing:.08em}
.res-grid b{font-family:var(--f-display);font-weight:400;font-size:clamp(16px,4.8vw,22px);font-variant-numeric:tabular-nums}
.newbest{align-self:center;background:var(--stamp);color:var(--paper);font-family:var(--f-display);border-radius:10px;padding:4px 12px;transform:rotate(-4deg);font-size:16px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sub{border:0;border-radius:14px;background:var(--cream);font-weight:900;font-size:14px;padding:12px}
.revive{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.ring{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:40px;background:conic-gradient(var(--tie) var(--p,100%),var(--line) 0)}
.ring span{width:88px;height:88px;border-radius:50%;background:var(--paper);display:grid;place-items:center}
.small-print{font-size:10px;color:var(--paper);opacity:.75;text-align:center;margin-top:8px;font-weight:700}
